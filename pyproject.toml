[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nca-memory"
version = "0.1.0"
description = "Memory-based adaptation with Neural Cellular Automata"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
"numpy",
"torch",
]

[project.optional-dependencies]
dev = [
"pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nca_memory*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]